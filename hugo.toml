# إعداد Hugo — المدونة
#
# إعداد الإنتاج للمدونة. إصدار Hugo نفسه مثبت مع بصمته في سير البناء.

baseURL = 'https://zero2one.sa/blog/'
title = 'مدونة من الصفر إلى الواحد'
enableRobotsTXT = false          # robots.txt يُدار من جذر النطاق (القسم 8.3)
enableGitInfo = false
timeZone = 'Asia/Riyadh'
summaryLength = 40

# قرار بند صفر: الإنجليزية بلا بادئة، العربية ببادئة — مطابقةً للموقع
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
# لا ننشئ /en/index.html كتحويل HTML إلى الجذر. الإنجليزية أصلًا في
# /blog/، والتحويل على جهة العميل يضيف صفحة ناقصة إلى فحوص SEO.
disableDefaultSiteRedirect = true

# تصنيف واحد مضبوط من العقد المركزي. قيم front matter هي slugs الثابتة
# (مثل seo)، بينما يولّد محوّل المحتوى أدناه أسماء EN/AR من schema.json.
[taxonomies]
  category = 'categories'

# سير البناء يستبدل content/ بمحتوى الكاتب. نبقي صفحات تعريف التصنيفات
# في مصدر منفصل ونركّب المصدرين معًا كي لا تضيع عند كل بناء.
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'taxonomy-content/categories'
    target = 'content/categories'

[languages]
  [languages.en]
    locale = 'en'
    label = 'English'
    direction = 'ltr'
    weight = 1
    title = 'ZERO 2 ONE Blog'
  [languages.ar]
    locale = 'ar'
    label = 'العربية'
    direction = 'rtl'
    weight = 2
    title = 'مدونة من الصفر إلى الواحد'

[permalinks]
  # القسم 8.1: بلا تاريخ وبلا تصنيف في المسار.
  # التاريخ يجعل المقال يبدو قديمًا، والتصنيف يكسر الرابط عند إعادة التصنيف.
  '/' = '/:slug/'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # القسم 12.2 — إلزامي. حساب كاتب مخترق يستطيع دسّ HTML خام
      # يصبح جزءًا دائمًا من كل صفحة.
      unsafe = false
  [markup.highlight]
    noClasses = false

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  page = ['HTML']

[params]
  organization = 'ZERO 2 ONE'
  organizationId = 'https://zero2one.sa/#organization'
    # نفس خاصية GA4 وحاوية GTM المستخدمتين على الموقع: المدونة جزء من
    # النطاق نفسه، وفصلها إلى خاصية ثانية يقطع رحلة الزائر بين المقال
    # وصفحة الخدمة في التقارير.
    ga4Id = 'G-Z7XN1NZY47'
    gtmId = 'GTM-TVKP5KSX'
  logo = 'https://zero2one.sa/assets/icons/logo-z2o.svg'
  defaultImage = 'https://zero2one.sa/assets/images/about-us-zero2one.webp'
  defaultImageAr = 'https://zero2one.sa/assets/images/about-us-zero2one.webp'
