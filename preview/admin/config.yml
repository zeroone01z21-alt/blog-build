# مولّد آليًا من controls/schema.json وpreview/admin/settings.json.
# لا تعدّل هذا الملف يدويًا؛ شغّل: python3 tools/generate_cms.py

backend:
  name: "github"
  repo: "zeroone01z21-alt/blog-content"
  branch: "main"
  base_url: "https://sveltia-cms-auth.01team9639.workers.dev"
  auth_methods:
    - "oauth"
app_title: "كتابة مدونة ZERO 2 ONE"
i18n:
  structure: "multiple_files"
  locales:
    - "en"
    - "ar"
  default_locale: "en"
slug:
  encoding: "ascii"
  sanitize_replacement: "-"
  maxlength: 60
  trim: true
  lowercase: true
  timezone: "local"
output:
  omit_empty_optional_fields: true
  yaml:
    quote: "double"
    indent_size: 2
    indent_sequences: true
media_folder: "/content/blog"
public_folder: "/blog"
media_libraries:
  all:
    max_file_size: 512000
    slugify_filename: true
    transformations:
      raster_image:
        format: "webp"
        quality: 85
        width: 1600
        height: 1600
collections:
  -
    name: "posts_en"
    label: "المقالات الإنجليزية"
    label_singular: "مقال إنجليزي"
    icon: "article"
    folder: "content/blog"
    path: "{{slug}}/index.en"
    slug: "{{fields.slug}}"
    identifier_field: "title"
    format: "yaml-frontmatter"
    extension: "md"
    media_folder: ""
    public_folder: ""
    create: true
    delete: false
    duplicate: false
    summary: "{{title}} · {{categories}}"
    fields:
      -
        name: "title"
        label: "عنوان المقال"
        required: true
        minlength: 10
        maxlength: 70
        widget: "string"
      -
        name: "meta_title"
        label: "عنوان محركات البحث (اختياري)"
        required: false
        hint: "اتركه فارغًا ليُستعمل عنوان المقال. املأه حين تريد عنوانًا مختلفًا في نتائج جوجل — يظهر كما تكتبه تمامًا، بلا إضافة اسم المدونة. لا يغيّر العنوان داخل الصفحة ولا بطاقة المشاركة."
        minlength: 10
        maxlength: 70
        widget: "string"
      -
        name: "focus_keyword"
        label: "الكلمة المفتاحية المستهدفة (اختياري)"
        required: false
        hint: "العبارة التي تريد أن يجدك بها الزائر في جوجل. حين تملأها يتحقّق النظام من ورودها في عنوان المقال وفي الوصف وفي نصّه، ويمنع النشر إن غابت عن أحدها. اتركها فارغة إن لم تكن مستهدِفًا عبارة بعينها."
        minlength: 3
        maxlength: 60
        widget: "string"
      -
        name: "description"
        label: "الوصف الذي يظهر في نتائج البحث"
        required: true
        minlength: 50
        maxlength: 160
        widget: "string"
      -
        name: "slug"
        label: "الرابط القصير بالإنجليزية"
        required: true
        hint: "استخدم حروفًا إنجليزية صغيرة وأرقامًا وشرطات. لا تغيّره بعد أول نشر؛ تغيير الرابط يحتاج تحويل 301 من المالك."
        maxlength: 60
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "الرابط يجب أن يكون حروفاً إنجليزية صغيرة وأرقاماً وشرطات فقط، مثل: why-ad-campaigns-fail"
        widget: "string"
      -
        name: "date"
        label: "تاريخ النشر"
        required: true
        hint: "يُملأ تلقائيًا عند إنشاء المقال. عدّله فقط عند جدولة تاريخ النشر."
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        picker_utc: false
        default: "{{now}}"
      -
        name: "lastmod"
        label: "تاريخ آخر تعديل"
        required: false
        hint: "حدّثه عند تعديل مقال منشور. اتركه فارغًا للمقال الجديد."
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        picker_utc: false
      -
        name: "draft"
        label: "حالة النشر"
        required: true
        hint: "مفعّل = مسودة لا تظهر في الموقع الحي. غير مفعّل = منشور، ما دام مفتاح الأرشفة غير مفعّل."
        widget: "boolean"
        default: true
        before_input: "منشور"
        after_input: "مسودة"
      -
        name: "archived"
        label: "أرشفة المقال"
        required: false
        hint: "فعّله لإخفاء المقال مع إبقائه محفوظًا. الأرشفة هي بديل الحذف."
        widget: "boolean"
        default: false
        before_input: "نشط"
        after_input: "مؤرشف"
      -
        name: "categories"
        label: "التصنيفات"
        required: true
        hint: "اختر تصنيفًا واحدًا على الأقل. الأسماء ثابتة وتُعرض للزائر بلغته."
        widget: "select"
        multiple: true
        min: 1
        options:
          -
            label: "Website Design & Development — تصميم وتطوير المواقع"
            value: "web-design"
          -
            label: "Search Engine Optimization (SEO) — تحسين محركات البحث (SEO)"
            value: "seo"
          -
            label: "Advertising Campaign Management — إدارة الحملات الإعلانية"
            value: "advertising"
          -
            label: "Brand Identity Development — تطوير الهوية التجارية"
            value: "brand-identity"
          -
            label: "Social Media Management & Content Creation — إدارة وسائل التواصل وصناعة المحتوى"
            value: "social-media"
          -
            label: "E-commerce & Custom Systems Development — تطوير المتاجر الإلكترونية والأنظمة المخصّصة"
            value: "ecommerce"
      -
        name: "featured_image"
        label: "صورة المشاركة"
        required: true
        hint: "ارفع صورة من جهازك. تُحفظ داخل مجلد المقال وتُضغط في المتصفح؛ الروابط الخارجية معطلة."
        widget: "image"
        choose_url: false
        multiple: false
        accept: "image/webp,image/avif,image/jpeg,image/png"
      -
        name: "featured_image_alt"
        label: "وصف صورة المشاركة"
        required: true
        hint: "اكتب ما يظهر في الصورة بجملة قصيرة مفيدة، من دون «صورة لـ»."
        minlength: 1
        widget: "string"
      -
        name: "body"
        label: "نص المقال"
        widget: "richtext"
        required: true
        buttons:
          - "bold"
          - "italic"
          - "heading-two"
          - "heading-three"
          - "heading-four"
          - "heading-five"
          - "heading-six"
          - "bulleted-list"
          - "numbered-list"
          - "blockquote"
          - "code"
          - "link"
        modes:
          - "rich-text"
          - "markdown"
        hint: "العناوين تبدأ من «عنوان 2» — «عنوان 1» هو عنوان المقال ويضعه الموقع تلقائيًّا. للربط الداخلي: حدّد الكلمة ثم اضغط زرّ الرابط واكتب مسارًا يبدأ بـ / مثل /ar/services/seo-riyadh/"
  -
    name: "posts_ar"
    label: "المقالات العربية"
    label_singular: "مقال عربي"
    icon: "article"
    folder: "content/blog"
    path: "{{slug}}/index.ar"
