# بناء المدونة ونشرها — القسم 6
#
# يُشغَّل من مستودع المحتوى عبر workflow_dispatch، ومن schedule.yml حين
# يحلّ موعد مقال مجدول أو تضيع إشارة حفظ.
#
# لماذا workflow_dispatch لا repository_dispatch (تصحيح للقسم 6.1):
#   الثاني يتطلب contents:write على هذا المستودع — أي تعديل قوالبه
#   وميزانياته، وهو ما وُضع القسم 6.2 لمنعه. أُثبت 2026-08-02: 403.
#
# لماذا النشر عبر مستودع الموقع لا FTP (تصحيح للقسم 6.5):
#   مزامنة Git في Hostinger تنشر محتوى مستودع الموقع إلى public_html
#   وتحذف ما ليس فيه. في 2026-08-04 محا نشرٌ للموقع مجلد /blog/ كاملًا
#   وكان يُرفع بـFTP. فلا مفرّ من التسليم داخل المستودع.
#   العزل المفقود يعوّضه tools/check_deploy_scope.py قبل كل دفعة.
#
# لماذا مقال معطوب لا يوقف البقية (2026-10):
#   كانت أي مشكلة في أي مقال توقف نشر المدونة كلها. 13 بناءً من 21 فشلت بين
#   12 و23 سبتمبر، كلٌّ بسبب مقال واحد، وبقي مقالان خارج الموقع ثمانية
#   أيام دون أن يعلم أحد. tools/build_blog.py يحجز المقال المعطوب وحده ويعيد
#   البوابات كلها على ما بقي؛ لا يُنشر شيء لم يجتزها. والعطل العام (قالب،
#   إعداد، صفحة قسم) يوقف النشر كله كما كان.
#
# لماذا ubuntu-24.04 لا ubuntu-latest:
#   GitHub ينقل ubuntu-latest إلى Ubuntu 26 ابتداءً من 19 أكتوبر 2026
#   (actions/runner-images#14748). البناء يعتمد على python3 وrsync في
#   الصورة نفسها؛ الانتقال يكون قرارًا مختبرًا لا مفاجأة صامتة.
name: build
run-name: نشر المدونة · ${{ inputs.content_sha || inputs.reason }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: سبب التشغيل
        required: false
        default: حفظ في مستودع المحتوى
      content_sha:
        description: SHA محتوى دقيق يرسله blog-content؛ اتركه فارغًا للتشغيل اليدوي
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # البناء والتراجع يكتبان zero2one-web/main. المجموعة الواحدة تمنع سباق
  # push، والطابور الكامل يمنع استبدال تشغيل منتظر عند وصول تشغيل ثالث.
  group: blog-site-write
  queue: max
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.164.0"
  HUGO_SHA256: "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4"

jobs:
  build:
    name: بناء ونشر
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.export.outputs.report }}
    steps:
      - name: قوالب المدونة
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: بدء إشارة المراقبة الاختيارية
        id: health_start
        continue-on-error: true
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: python3 tools/healthcheck.py start

      - name: تثبيت مرجع المحتوى المطلوب
        env:
          CONTENT_SHA: ${{ inputs.content_sha }}
        run: |
          set -euo pipefail
          if [ -n "$CONTENT_SHA" ] && [[ ! "$CONTENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::content_sha يجب أن يكون SHA كاملًا من 40 محرفًا صغيرًا."
            exit 1
          fi

      # التاريخ كاملًا لا آخر نسخة: إن حُجز مقال منشور أصلًا، يُبنى من آخر
      # نسخة محفوظة منه تجتاز البوابات، فلا يختفي من الموقع بخطأ في تعديل.
      - name: المحتوى
        id: content_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zeroone01z21-alt/blog-content
          ref: ${{ inputs.content_sha || 'main' }}
          path: .content-src
          fetch-depth: 0

      - name: التحقق من بصمات الضوابط
        id: controls
        run: python3 tools/check_controls.py

      - name: فحص لوحة الكاتب المولّدة
        id: cms
        run: python3 tools/check_cms.py

      # الموقع يُستنسخ **قبل** البناء لا بعده: هو مصدر الهيكل، لا وجهة النشر
      # وحدها. الخطوة التالية تستخرج منه البرغر والقائمة الجانبية والفوتر،
      # فتُبنى المدونة على هيكل الموقع كما هو **الآن**، لا كما كان يوم آخر
      # مزامنة يدوية. ومنه يعرف بنّاء المدونة أيّ المقالات منشور حاليًا.
      - name: مستودع الموقع
        id: site_checkout
        env:
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::السر SITE_REPO_TOKEN غير مضبوط."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/01team9639-maker/zero2one-web.git" site \
            2>&1 | sed -E "s#//[^@]*@#//***@#g"

      # الرمز الذي يكتب الموقع له تاريخ انتهاء. حين ينتهي يتوقف كل نشر.
      # التحذير يصل في البلاغ قبل 21 يومًا؛ الرمز نفسه لا يُطبع.
      - name: صلاحية رمز النشر
        id: token_check
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: python3 tools/blog_report.py token-check --output "$RUNNER_TEMP/token.json"

      # جذر المشكلة التي طُلب حلّها: الموقع 22 ملف HTML يكرّر الفوتر نصًّا،
      # ولا مكوّن واحد يولّده. فلا يمكن للمدونة أن «تشارك» ملفًا غير موجود.
      # البديل الوحيد الصادق: الاستخراج الآلي في كل بناء. يتغيّر هاتف الفوتر
      # أو رابط سوشيال في الموقع، فتتبعه المدونة في النشر التالي بلا لمسة يد.
      # وإن تغيّرت بنية الصفحة فالاستخراج يفشل بصوت عالٍ لا يمرّ صامتًا.
      - name: مزامنة هيكل الموقع إلى المدونة
        id: chrome_sync
        run: |
          set -euo pipefail
          python3 tools/sync_site_chrome.py site
          git --no-pager diff --stat -- layouts/partials/site layouts/partials/site-css.html layouts/partials/site-scripts.html

      - name: تثبيت Hugo ببصمة الإصدار
        id: hugo_install
        run: |
          set -euo pipefail
          f="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSLo "$f" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f"
          echo "${HUGO_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" hugo && sudo mv hugo /usr/local/bin/
          hugo version

      # البوابات نفسها وبالترتيب نفسه: تجهيز المحتوى وعقده، Hugo، الخرائط
      # والفهرسة، SEO، الميزانيات. الخروج 1 = عطل عام: لا نشر.
      - name: بناء المدونة — مقال معطوب يُحجز وحده
        id: build_blog
        run: |
          python3 tools/build_blog.py --source .content-src --site site \
            --hugo hugo --report "$RUNNER_TEMP/blog-report.json"

      - name: استبدال blog/ وحده
        id: replace_blog
        run: |
          set -euo pipefail
          mkdir -p site/blog
          rsync -a --delete public/ site/blog/

      - name: تجهيز إخطار IndexNow
        id: indexnow_collect
        run: |
          python3 tools/indexnow.py collect site \
            --output "$RUNNER_TEMP/indexnow.json" \
            --deployment-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: 🔒 حارس النطاق
        id: deploy_scope
        run: python3 tools/check_deploy_scope.py site

      - name: الدفع
        id: push_site
        env:
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          cd site
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "لا تغييرات — الموقع محدَّث أصلًا."
            exit 0
          fi
          git config user.name "ZERO 2 ONE"
          git config user.email "01team9639@gmail.com"
          git add blog
          git commit -q -m "نشر المدونة — ${REASON}"
          git push -q origin main 2>&1 | sed -E "s#//[^@]*@#//***@#g"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "✅ نُشر $(git rev-parse --short HEAD)"

      # مزامنة Hostinger غير متزامنة ولا سقف معلوم لها. حدث فعليًّا أن
      # تجاوزت 240 ثانية، فظهر التشغيل **أحمر بينما النشر نجح** — والدفع
      # إلى مستودع الموقع تمّ قبل هذه الخطوة أصلًا.
      #
      # إشارة تكذب أسوأ من غياب الإشارة: من يرى أحمر على نشر ناجح مرّتين
      # يتوقّف عن قراءة اللون. لذلك:
      #   • النافذة 600 ثانية بدل 240 — تغطّي البطء المعتاد
      #   • continue-on-error: تأخّر المزامنة تحذير لا فشل
      # وIndexNow يبقى مشروطًا بنجاحها فلا يُخطَر محرك البحث بنسخة لم
      # تظهر بعد. الخرائط تلتقط الروابط لاحقًا على أي حال.
      - name: تحقق خارجي من وصول النشر
        id: live_verify
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python3 tools/wait_for_live.py \
            site/blog/indexnow-deploy.txt \
            https://zero2one.sa/blog/indexnow-deploy.txt \
            --seconds 600

      # النشر عبر Hostinger غير متزامن. الأداة تنتظر علامة هذا البناء تحديداً
      # قبل الإخطار، حتى لا يزور محرك البحث النسخة السابقة. تعطل IndexNow لا
      # يحوّل نشرًا ناجحًا إلى فشل؛ يعاد اكتشاف الروابط من الخرائط لاحقًا.
      - name: إخطار IndexNow بعد ظهور النشر
        id: indexnow_submit
        if: steps.live_verify.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: python3 tools/indexnow.py submit "$RUNNER_TEMP/indexnow.json"

      - name: إشارة نجاح المراقبة
        if: success()
        continue-on-error: true
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: python3 tools/healthcheck.py success

      - name: إشارة فشل المراقبة
        if: failure()
        continue-on-error: true
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: python3 tools/healthcheck.py fail

      # الملخص من تقرير build_blog.py: حالة كل مقال وسببها، بالعربية للكاتب
      # وبالإنجليزية للمالك. نصّ المقالات يُعقَّم قبل عرضه.
      - name: ملخص النتيجة للكاتب والمالك
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          PUSH_OUTCOME: ${{ steps.push_site.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          INDEXNOW_OUTCOME: ${{ steps.indexnow_submit.outcome }}
          PUSHED_SHA: ${{ steps.push_site.outputs.sha }}
        run: |
          python3 tools/blog_report.py summary \
            --report "$RUNNER_TEMP/blog-report.json" --token "$RUNNER_TEMP/token.json"

      - name: تسليم التقرير لمهمة الإبلاغ
        id: export
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          PUSH_OUTCOME: ${{ steps.push_site.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          INDEXNOW_OUTCOME: ${{ steps.indexnow_submit.outcome }}
          PUSHED_SHA: ${{ steps.push_site.outputs.sha }}
        run: |
          python3 tools/blog_report.py export \
            --report "$RUNNER_TEMP/blog-report.json" --token "$RUNNER_TEMP/token.json" \
            >> "$GITHUB_OUTPUT"

  # مهمة منفصلة كي يبقى رمز مهمة البناء (التي تعالج نصّ الكاتب) للقراءة
  # فقط. هذه وحدها تكتب البلاغ وتعيد تفعيل الجدولة، ولا ترى المحتوى ولا
  # الأسرار. تعطّلها تحذير لا يقلب نشرًا ناجحًا إلى فشل.
  notify:
    name: إبلاغ الكاتب والمالك
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: أدوات المدونة
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: بلاغ «حالة نشر المدونة»
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_BUNDLE: ${{ needs.build.outputs.report }}
          BUILD_RESULT: ${{ needs.build.result }}
          # المالك (بريد 01team9639@gmail.com) والكاتب. الذكر يرسل بريدًا.
          NOTIFY_MENTIONS: "01team9639-maker zero2one012025-png"
        run: python3 tools/blog_report.py notify
